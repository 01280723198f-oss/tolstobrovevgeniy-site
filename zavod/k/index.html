<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Контент-завод — кабинет</title>
<style>
/* Стиль «Ботодела»: тёмное меню, тёплый фон, жёлтый акцент, белые карточки */
:root{
  --bg:#f4efe6;--panel:#fff;--panel-2:#faf7f1;--ink:#1f1b16;--muted:#665d52;--line:#ebe4d7;
  --side:#17161a;--side-2:#232127;--side-ink:#e9e6e1;--side-muted:#8d8a92;
  --acc:#f2b21b;--acc-2:#9a6a00;--acc-ink:#2a1e00;--acc-soft:#fff3cf;--hint-ink:#5a4300;
  --ok:#16733a;--ok-soft:#e6f6ec;--code:#f3eee5;--r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#141317;--panel:#1d1c21;--panel-2:#19181d;--ink:#ece8e1;--muted:#a39b90;--line:#2c2a30;
  --acc-soft:#3a2f12;--hint-ink:#f4dc9a;--ok-soft:#173523;--ok:#5fcf8b;--code:#232127}}
:root[data-theme=dark]{--bg:#141317;--panel:#1d1c21;--panel-2:#19181d;--ink:#ece8e1;--muted:#a39b90;--line:#2c2a30;
  --acc-soft:#3a2f12;--hint-ink:#f4dc9a;--ok-soft:#173523;--ok:#5fcf8b;--code:#232127}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
a{color:inherit}
.app{display:flex;min-height:100vh}
aside{width:272px;flex:none;background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px 14px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center;font-size:19px;flex:none}
.brand b{display:block;font-size:15px;letter-spacing:.02em}.brand b span{color:var(--acc)}
.brand small{display:block;font-size:9.5px;color:var(--side-muted);text-transform:uppercase;letter-spacing:.08em;line-height:1.3}
.grp{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);padding:16px 22px 6px}
aside a{display:flex;align-items:flex-start;gap:10px;margin:2px 10px;padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--side-ink);font-size:13.5px;line-height:1.35}
aside a:hover{background:var(--side-2)}
aside a.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
aside a .i{width:18px;flex:none;text-align:center;color:var(--side-muted)}
aside a .i.ok{color:#5fcf8b}aside a.on .i{color:var(--acc-ink)}
aside .foot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--side-2);font-size:11.5px;color:var(--side-muted)}
main{flex:1;min-width:0}
header{display:flex;align-items:center;gap:14px;padding:14px 26px;background:var(--panel-2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--ok-soft);color:var(--ok)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.week{background:var(--acc-soft);color:var(--acc-2)}
.btn{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;background:#ece6da;color:#1f1b16;text-decoration:none;display:inline-block}
.btn.main{background:var(--acc);color:var(--acc-ink)}
.btn.sm{padding:6px 10px;font-size:13px}
.copy{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.copy:hover{border-color:var(--acc)}
.wrap{padding:22px 26px 60px;max-width:900px}
.card{background:var(--panel);border-radius:var(--r);border:1px solid var(--line);box-shadow:0 1px 2px rgba(40,30,10,.04);padding:28px 32px}
.doc h1{font-size:28px;line-height:1.2;letter-spacing:-.01em;margin:.3em 0 .6em}
.doc h2{font-size:21px;margin:1.8em 0 .6em}.doc h3{font-size:17px;margin:1.6em 0 .5em}
.doc hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.doc blockquote{margin:1em 0;padding:12px 16px;background:var(--acc-soft);color:var(--hint-ink);border-radius:12px}
.doc blockquote p{margin:.3em 0}
.doc pre{position:relative;background:var(--code);border:1px solid var(--line);padding:46px 16px 16px;border-radius:12px;overflow:auto;font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap}
.doc pre .copy{position:absolute;top:10px;right:10px}
.doc code{background:var(--code);padding:1px 6px;border-radius:6px;font:.9em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.doc pre code{background:none;padding:0;font:inherit}
.doc table{width:100%;border-collapse:collapse;font-size:14px;margin:1em 0;display:block;overflow-x:auto}
.doc th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:bottom}
.doc td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.doc tr:last-child td{border-bottom:0}
.doc img.pic{display:block;max-width:100%;border-radius:12px;border:1px solid var(--line);margin:14px 0 6px;background:var(--panel-2);min-height:60px}
.doc video.vid{display:block;width:100%;max-width:360px;aspect-ratio:9/16;border-radius:14px;background:#000;margin:14px 0 24px}
.doc p>em:only-child{display:block;color:var(--muted);font-size:13.5px}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin:30px 0 0;padding-top:20px;border-top:1px solid var(--line)}
.meta{color:var(--muted);font-size:13px;margin:0 0 6px}
.gate{max-width:480px;margin:14vh auto;padding:28px;text-align:center}
.menu{display:none;background:var(--side);color:var(--side-ink)}
@media (max-width:860px){
  aside{position:fixed;top:0;left:0;bottom:0;height:auto;z-index:20;transform:translateX(-100%);transition:transform .2s;width:86vw;max-width:320px}
  aside.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.45)}
  .menu{display:inline-block}header{padding:10px 16px}.wrap{padding:14px 12px 60px}.card{padding:18px 16px}.doc h1{font-size:23px}
}
</style>
</head>
<body>
<div id="app"><div class="gate card"><p>Открываю кабинет…</p></div></div>
<script>
(()=>{
const VER="18a60d63f8", KS="zavod-key", DONE="zavod-done";
const $=s=>document.querySelector(s), app=$("#app");
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const th=store.get("zavod-theme"); if(th) document.documentElement.dataset.theme=th;
const toggleTheme=()=>{const d=document.documentElement;const cur=d.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");d.dataset.theme=cur==="dark"?"light":"dark";store.set("zavod-theme",d.dataset.theme)};
// ключ: из ссылки (#ключ) → запоминаем; дальше адрес после # — это маршрут урока
let h=location.hash.slice(1);
if(/^[A-Za-z0-9_-]{43}$/.test(h)){store.set(KS,h);history.replaceState(null,"",location.pathname+"#l=00")}
const raw=store.get(KS)||(/^[A-Za-z0-9_-]{43}$/.test(h)?h:null);
const fail=t=>app.innerHTML=`<div class="gate card"><h2>Кабинет закрыт</h2><p>${t}</p><p class="meta">Открой ссылку из письма с доступом целиком — ключ спрятан в её конце, после знака #.</p></div>`;
if(!raw) return fail("В ссылке нет ключа доступа.");
const b64=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
let K, D, done=new Set(JSON.parse(store.get(DONE)||"[]"));
const dec=async buf=>new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},K,buf.slice(12)));
(async()=>{
 try{K=await crypto.subtle.importKey("raw",b64(raw),"AES-GCM",false,["decrypt"]);
  const r=await fetch("c.bin?v="+VER);D=JSON.parse(new TextDecoder().decode(await dec(new Uint8Array(await r.arrayBuffer()))));
 }catch(e){return fail("Ключ не подошёл или ссылка обрезана.")}
 app.innerHTML=`<div class="app"><aside id="nav"></aside><main><header><button class="btn sm menu" id="menu" aria-label="Уроки">☰</button><h1 id="ttl"></h1><span class="pill" id="prog"></span><button class="copy" id="theme" title="Светлая / тёмная тема">◐</button></header><div class="wrap"><div class="card doc" id="doc"></div></div></main></div>`;
 $("#menu").onclick=()=>$("#nav").classList.toggle("open");
 $("#theme").onclick=toggleTheme;
 addEventListener("hashchange",show);show();
})();
function navHtml(cur){
 const weeks={};D.lessons.forEach(l=>(weeks[l.week]=weeks[l.week]||[]).push(l));
 const q=encodeURIComponent;
 let s=`<div class="brand"><div class="logo">🏭</div><div><b>Контент-<span>завод</span></b><small>${D.lessons.length} уроков · Claude Code</small></div></div>`;
 s+=`<div class="grp">Начало</div><a href="#d=${q("как-писать-запрос-claude.md")}" class="${cur==="d:как-писать-запрос-claude.md"?"on":""}"><span class="i">📘</span><span>Как писать запрос Claude</span></a>`;
 for(const w of Object.keys(weeks)) s+=`<div class="grp">Неделя ${w}</div>`+weeks[w].map(l=>`<a href="#l=${l.id}" class="${cur===l.id?"on":""}"><span class="i ${done.has(l.id)?"ok":""}">${done.has(l.id)?"✓":"○"}</span><span>${l.title}</span></a>`).join("");
 s+=`<div class="grp">Ещё</div><a href="#t=" class="${cur==="t"?"on":""}"><span class="i">🗂</span><span>Шаблоны</span></a><a href="#d=${q("словарь-терминов.md")}" class="${cur==="d:словарь-терминов.md"?"on":""}"><span class="i">📖</span><span>Словарь терминов</span></a>`;
 s+=`<div class="foot">Прогресс хранится в этом браузере</div>`;
 $("#nav").innerHTML=s;$("#prog").textContent=`${done.size} из ${D.lessons.length}`;
}
function show(){
 const m=/^#([ltd])=(.*)$/.exec(location.hash), doc=$("#doc");let cur=null;
 if(!m||m[1]==="l"){const id=m?decodeURIComponent(m[2]):D.lessons[0].id;const i=D.lessons.findIndex(l=>l.id===id);const l=D.lessons[i<0?0:i];cur=l.id;
  const p=D.lessons[i-1],n=D.lessons[i+1];
  $("#ttl").textContent=l.title;doc.innerHTML=`<span class="pill week">Неделя ${l.week}</span>`+l.html+`<div class="bar"><button class="btn main" id="done">${done.has(l.id)?"✓ Урок пройден":"Отметить урок пройденным"}</button>${p?`<a class="btn" href="#l=${p.id}">← ${p.id}</a>`:""}${n?`<a class="btn" href="#l=${n.id}">${n.id} →</a>`:""}</div>`;
  $("#done").onclick=()=>{done.has(l.id)?done.delete(l.id):done.add(l.id);store.set(DONE,JSON.stringify([...done]));show()};
 } else if(m[1]==="t"){const f=decodeURIComponent(m[2]);cur="t";$("#ttl").textContent="Шаблоны";const t=D.templates.find(x=>x.file===f);
  doc.innerHTML=t?`<p class="meta"><a href="#t=">← все шаблоны</a></p><div class="bar" style="border:0;margin-top:0;padding-top:0"><button class="btn main" id="dl">Скачать .md</button><button class="btn" id="cpall">Скопировать текст</button></div>`+t.html
   :`<h1>Шаблоны</h1><p>Скачай файл и положи в свой проект — или скопируй текст и попроси Claude заполнить его вместе с тобой.</p><ul>`+D.templates.map(x=>`<li><a href="#t=${encodeURIComponent(x.file)}">${x.title}</a> <span class="meta">${x.file}</span></li>`).join("")+`</ul>`;
  if(t){$("#dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t.md],{type:"text/markdown"}));a.download=t.file;a.click()};$("#cpall").onclick=e=>copy(t.md,e.target)}
 } else {const f=decodeURIComponent(m[2]);const d=D.docs.find(x=>x.file===f)||D.docs[0];cur="d:"+d.file;$("#ttl").textContent=d.title;doc.innerHTML=d.html}
 navHtml(cur);$("#nav").classList.remove("open");scrollTo(0,0);
 doc.querySelectorAll("pre").forEach(pre=>{const b=document.createElement("button");b.className="copy";b.textContent="Скопировать";const txt=pre.innerText.trim();b.onclick=()=>copy(txt,b);pre.appendChild(b)});
 lazy(doc);
}
function copy(text,btn){const ok=()=>{const t=btn.textContent;btn.textContent="Скопировано ✓";setTimeout(()=>btn.textContent=t,1500)};
 (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(ok,()=>{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();ok()})}
const cache={};
async function load(el){const id=el.dataset.m;if(!id||el.dataset.ok)return;el.dataset.ok=1;
 try{cache[id]=cache[id]||URL.createObjectURL(new Blob([await dec(new Uint8Array(await (await fetch(id+"?v="+VER)).arrayBuffer()))],{type:D.types[id]}));el.src=cache[id]}catch(e){el.alt="не загрузилось"}}
function lazy(root){const els=root.querySelectorAll("[data-m]");
 if(!("IntersectionObserver" in window)){els.forEach(load);return}
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);load(e.target)}}),{rootMargin:"600px"});els.forEach(e=>io.observe(e))}
})();
</script>
</body>
</html>
