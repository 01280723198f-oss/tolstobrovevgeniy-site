<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="ui-monospace, Menlo, Consolas, monospace">
  <rect width="1000" height="480" rx="14" fill="#0e0f13" stroke="#262932"/>
  <rect x="0" y="0" width="1000" height="42" rx="14" fill="#16181f"/>
  <rect x="0" y="28" width="1000" height="14" fill="#16181f"/>
  <circle cx="26" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="21" r="6" fill="#27c93f"/>
  <text x="500" y="26" text-anchor="middle" fill="#6b6f7a" font-size="13">Терминал — папка твоего проекта</text>

  <text x="30" y="90"  font-size="15"><tspan fill="#6b6f7a"># 1. запускаем Claude Code в папке проекта</tspan></text>
  <text x="30" y="120" font-size="15"><tspan fill="#7ee787">❯</tspan><tspan fill="#ECEDEE"> claude</tspan></text>

  <text x="30" y="165" font-size="15"><tspan fill="#6b6f7a"># 2. пусть сам изучит проект и создаст паспорт</tspan></text>
  <text x="30" y="195" font-size="15"><tspan fill="#7ee787">❯</tspan><tspan fill="#ffb648"> /init</tspan></text>

  <text x="30" y="235" font-size="14" fill="#9498a3">  ⎿ Читаю файлы проекта...</text>
  <text x="30" y="262" font-size="14" fill="#9498a3">  ⎿ Определяю стек и структуру...</text>
  <text x="30" y="289" font-size="14"><tspan fill="#7ee787">  ✓</tspan><tspan fill="#9498a3"> Создан файл </tspan><tspan fill="#ff6a2b">CLAUDE.md</tspan><tspan fill="#9498a3"> в корне проекта</tspan></text>

  <text x="30" y="335" font-size="15"><tspan fill="#6b6f7a"># 3. редактируем память напрямую командой</tspan></text>
  <text x="30" y="365" font-size="15"><tspan fill="#7ee787">❯</tspan><tspan fill="#ffb648"> /memory</tspan></text>
  <text x="30" y="395" font-size="14" fill="#9498a3">  ⎿ Открываю файлы памяти для редактирования</text>

  <text x="30" y="440" font-size="14"><tspan fill="#6b6f7a">  💡 CLAUDE.md Claude читает САМ в начале каждой сессии</tspan></text>
</svg>
