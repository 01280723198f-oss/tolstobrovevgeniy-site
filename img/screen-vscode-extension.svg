<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
  <rect width="1000" height="520" rx="14" fill="#0e0f13" stroke="#262932"/>
  <!-- title bar -->
  <rect x="0" y="0" width="1000" height="40" rx="14" fill="#16181f"/>
  <rect x="0" y="26" width="1000" height="14" fill="#16181f"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="20" r="6" fill="#27c93f"/>
  <text x="500" y="25" text-anchor="middle" fill="#6b6f7a" font-size="13">Visual Studio Code — вкладка «Extensions»</text>

  <!-- activity bar -->
  <rect x="0" y="40" width="56" height="480" fill="#16181f"/>
  <text x="28" y="86" text-anchor="middle" font-size="20" fill="#6b6f7a">📄</text>
  <text x="28" y="130" text-anchor="middle" font-size="20" fill="#6b6f7a">🔍</text>
  <!-- extensions icon highlighted -->
  <rect x="0" y="156" width="3" height="36" fill="#ff6a2b"/>
  <text x="28" y="182" text-anchor="middle" font-size="20" fill="#ECEDEE">🧩</text>
  <text x="28" y="226" text-anchor="middle" font-size="20" fill="#6b6f7a">⎇</text>

  <!-- search box -->
  <text x="80" y="78" fill="#6b6f7a" font-size="13" font-family="ui-monospace, monospace"># 1. иконка 🧩 слева → 2. ищи «Claude Code» → 3. Install</text>
  <rect x="80" y="92" width="500" height="40" rx="8" fill="#0e0f13" stroke="#ff6a2b"/>
  <text x="98" y="117" fill="#ECEDEE" font-size="15">Claude Code</text>

  <!-- result card -->
  <rect x="80" y="150" width="840" height="150" rx="12" fill="#16181f" stroke="#262932"/>
  <rect x="100" y="170" width="56" height="56" rx="12" fill="#ff6a2b"/>
  <text x="128" y="208" text-anchor="middle" font-size="28">✳️</text>
  <text x="176" y="190" fill="#ECEDEE" font-size="19" font-weight="700">Claude Code</text>
  <text x="176" y="216" fill="#9498a3" font-size="14">Anthropic · официальное расширение · ⭐ 4.9</text>
  <text x="176" y="242" fill="#9498a3" font-size="14">Запускает Claude Code прямо внутри редактора, видит твои файлы.</text>

  <!-- install button -->
  <rect x="740" y="172" width="150" height="44" rx="10" fill="#ff6a2b"/>
  <text x="815" y="200" text-anchor="middle" fill="#0c0d10" font-size="16" font-weight="800">Install</text>

  <text x="80" y="345" fill="#6b6f7a" font-size="14" font-family="ui-monospace, monospace"># после установки слева появится иконка Claude — клик, и панель откроется</text>
  <text x="80" y="372" fill="#6b6f7a" font-size="14" font-family="ui-monospace, monospace"># быстрый запуск: ⌘ + Esc (Mac) / Ctrl + Esc (Windows)</text>
</svg>
