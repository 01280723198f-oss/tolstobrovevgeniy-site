<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
  <rect width="1000" height="480" rx="14" fill="#0e0f13" stroke="#262932"/>
  <!-- browser chrome -->
  <rect x="0" y="0" width="1000" height="56" rx="14" fill="#16181f"/>
  <rect x="0" y="40" width="1000" height="16" fill="#16181f"/>
  <circle cx="26" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="28" r="6" fill="#27c93f"/>
  <rect x="110" y="14" width="820" height="28" rx="14" fill="#0e0f13" stroke="#262932"/>
  <text x="128" y="33" fill="#9498a3" font-size="13" font-family="ui-monospace, monospace">🔒 code.visualstudio.com</text>

  <!-- page -->
  <text x="60" y="140" fill="#ECEDEE" font-size="34" font-weight="800">Visual Studio Code</text>
  <text x="60" y="178" fill="#9498a3" font-size="17">Бесплатный редактор кода. В нём Claude Code работает в окне с твоим проектом.</text>

  <!-- big download button -->
  <rect x="60" y="220" width="320" height="64" rx="12" fill="#ff6a2b"/>
  <text x="220" y="260" text-anchor="middle" fill="#0c0d10" font-size="19" font-weight="800">⬇  Download for macOS</text>

  <text x="60" y="320" fill="#6b6f7a" font-size="14" font-family="ui-monospace, monospace"># нажми синюю/оранжевую кнопку → скачается .zip</text>
  <text x="60" y="346" fill="#6b6f7a" font-size="14" font-family="ui-monospace, monospace"># распакуй и перетащи Visual Studio Code в «Программы»</text>

  <!-- platform chips -->
  <rect x="60" y="380" width="120" height="40" rx="20" fill="#16181f" stroke="#262932"/>
  <text x="120" y="405" text-anchor="middle" fill="#ECEDEE" font-size="14">🍎 macOS</text>
  <rect x="196" y="380" width="120" height="40" rx="20" fill="#16181f" stroke="#262932"/>
  <text x="256" y="405" text-anchor="middle" fill="#9498a3" font-size="14">🪟 Windows</text>
  <rect x="332" y="380" width="120" height="40" rx="20" fill="#16181f" stroke="#262932"/>
  <text x="392" y="405" text-anchor="middle" fill="#9498a3" font-size="14">🐧 Linux</text>
</svg>
